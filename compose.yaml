services:
  agent-runtime:
    build:
      context: ./agent-runtime
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      AGENT_RUNTIME_URL: http://agent-runtime:8000
    depends_on:
      agent-runtime:
        condition: service_healthy
    ports:
      - "5050:5050"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5050/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
