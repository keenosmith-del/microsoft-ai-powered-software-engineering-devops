name: Platform validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r agent-runtime/requirements.txt
      - name: Deterministic Python contracts and evidence safety
        working-directory: agent-runtime
        run: python -m unittest test_configuration_contract test_evidence_context test_runtime_contract
      - name: Browser dependency
        run: npx playwright install --with-deps chromium
      - name: Deterministic local browser journey
        run: npm run test:e2e
      - name: Dependency vulnerability checks
        run: |
          npm audit --audit-level=high
          npm audit --prefix frontend --audit-level=high
